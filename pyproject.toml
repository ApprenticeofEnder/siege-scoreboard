[project]
name = "siege-scoreboard"
version = "0.1.0"
description = "Siege defense competition scoreboard (rewrite scaffold)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "jinja2>=3.1",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "faker>=40.23.0",
    "pytest>=9.0.3",
    "ruff>=0.8",
]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pyright]
venvPath = ".devenv/state"
venv = "venv"
