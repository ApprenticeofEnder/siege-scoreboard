[project]
name = "siege-scoreboard"
version = "0.1.0"
description = "Siege defense competition scoreboard (rewrite scaffold)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "alembic>=1.14",
  "fastapi>=0.115",
  "jinja2>=3.1",
  "pydantic-settings>=2.7",
  "pyyaml>=6.0",
  "sortedcontainers-pydantic>=2.0.0",
  "sqlmodel>=0.0.22",
  "structlog>=26.1.0",
  "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "basedpyright>=1.39.8",
    "faker>=40.23.0",
    "pytest>=9.0.3",
    "ruff>=0.8",
]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"app/models/*.py" = ["F821"]

[tool.basedpyright]
venvPath = ".devenv/state"
venv = "venv"
include = ["**/*.py"]
exclude = ["**/node_modules", "**/__pycache__"]
pythonVersion = "3.13"
reportAny = false
reportIncompatibleVariableOverride = false

[[tool.basedpyright.overrides]]
include = ["app/models"]
reportUndefinedVariable = false
reportIncompatibleVariableOverride = false
